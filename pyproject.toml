[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limpiacolor"
version = "1.0.0"
description = "Editor de imágenes y videos con máscaras multicolor y relleno por vecinos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<6",
    "Pillow>=10.4,<13",
    "imageio-ffmpeg>=0.6,<0.7",
]

[project.scripts]
limpiacolor = "limpiacolor.gui:main"

[tool.setuptools.packages.find]
include = ["limpiacolor*"]
